name: Wells Manager Beta JSON tests

on:
  push:
    branches: [ main ]
    paths:
      - 'WELLS MANAGER BETA/**'
      - '.github/workflows/beta-json-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'WELLS MANAGER BETA/**'
      - '.github/workflows/beta-json-tests.yml'
  workflow_dispatch:

jobs:
  json-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install python-docx
      - name: Compile Beta Python
        working-directory: WELLS MANAGER BETA
        run: |
          python -m py_compile main.py
          python -m py_compile Wells_Translator/wells_translator_core.py
          python -m py_compile Wells_Translator/wells_json_core.py
          python -m py_compile Wells_Revisor/wells_revisor_core.py
          python -m py_compile Wells_Revisor/wells_blindagem.py
          python -m py_compile Wells_Revisor_JSON/wells_revisor_json_core.py
          python -m py_compile Wells_Revisor_JSON/wells_blindagem_json.py
          python -m py_compile Wells_Revisor_JSON/wells_isolador_renpy_json.py
          python -m py_compile Wells_Revisor_JSON/wells_guia_ptbr_json.py
          python -m py_compile Wells_Revisor_JSON/wells_base_linguistica_json.py
      - name: Exercise blindagem persistence and CRUD
        working-directory: WELLS MANAGER BETA
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Exercise JSON full/block TXT/DOCX and reinjection
        working-directory: WELLS MANAGER BETA
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from Wells_Translator.wells_json_core import (
              export_json_full_txt, export_json_blocks_txt,
              export_json_full_docx, export_json_blocks_docx,
              inject_json_translations,
          )

          original = {
              "Dalen": "O vale",
              "Princess Gwen": "Princesa Gwen",
              "Line with\nnewline": "Linha com\nquebra",
              'Quote "test"': 'Teste "aspas"',
              "[mc] is here": "[mc] está aqui",
          }

          exporters = [
              ("txt", "full", export_json_full_txt, {}),
              ("txt", "blocks", export_json_blocks_txt, {"max_bytes": 80}),
              ("docx", "full", export_json_full_docx, {}),
              ("docx", "blocks", export_json_blocks_docx, {"max_file_bytes": 37000}),
          ]

          for fmt, mode, exporter, extra in exporters:
              with tempfile.TemporaryDirectory() as td:
                  root = Path(td)
                  source = root / "strings.json"
                  source.write_text(json.dumps(original, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  result = exporter(source, root, return_session=True, **extra)
                  session = result[-1]

                  # Reinjeção sem edição precisa ser semanticamente idêntica.
                  count, _ = inject_json_translations(source, root, fmt, session=session)
                  assert count == len(original)
                  assert json.loads(source.read_text(encoding="utf-8")) == original

                  # Chaves nativas continuam intocadas e somente valores mudam.
                  if fmt == "txt":
                      targets = sorted(root.glob("traduzido*.txt"))
                      p = targets[0]
                      lines = p.read_text(encoding="utf-8").splitlines()
                      lines[0] = json.dumps("Dalen", ensure_ascii=False)
                      p.write_text("\n".join(lines) + "\n", encoding="utf-8")
                  else:
                      # O round-trip DOCX já testa alinhamento e leitura; a
                      # alteração dirigida é coberta no TXT com a mesma injeção.
                      continue

                  inject_json_translations(source, root, fmt, session=session)
                  after = json.loads(source.read_text(encoding="utf-8"))
                  assert list(after.keys()) == list(original.keys())
                  assert after["Dalen"] == "Dalen"

          # Caso real importante: JSON pode conter chave duplicada. O motor
          # deve preservar as duas ocorrências em vez de colapsá-las em dict.
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              source = root / "strings.json"
              source.write_text('{"Guard":"Guarda 1","Guard":"Guarda 2"}\n', encoding="utf-8")
              result = export_json_full_txt(source, root, return_session=True)
              assert result[1] == 2
              inject_json_translations(source, root, "txt", session=result[-1])
              pairs = json.loads(source.read_text(encoding="utf-8"), object_pairs_hook=lambda x: x)
              assert pairs == [("Guard", "Guarda 1"), ("Guard", "Guarda 2")]

          print("JSON core tests OK")
          PY


  windows-build:
    needs: json-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install python-docx pyinstaller
      - name: Build Wells Manager Beta
        working-directory: WELLS MANAGER BETA
        run: python -m PyInstaller --clean --noconfirm Wells_Manager.spec
      - name: Smoke-check executable
        shell: pwsh
        run: |
          $exe = "WELLS MANAGER BETA/dist/Wells_Manager.exe"
          if (-not (Test-Path $exe)) { throw "Wells_Manager.exe não foi gerado." }
          $item = Get-Item $exe
          if ($item.Length -lt 100000) { throw "Executável inesperadamente pequeno: $($item.Length) bytes." }
          Write-Host "Wells_Manager.exe OK: $($item.Length) bytes"
      - name: Package Beta checkpoint
        shell: pwsh
        run: |
          $stage = "Wells_Manager_Beta"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "WELLS MANAGER BETA/dist/Wells_Manager.exe" "$stage/Wells_Manager.exe"
          $blindagem = "WELLS MANAGER BETA/blindagem.txt"
          if (Test-Path $blindagem) {
            Copy-Item $blindagem "$stage/blindagem.txt"
          } else {
            "[NOMES_BLINDADOS]`r`n`r`n[NOMES_TRADUZIVEIS]`r`n" | Set-Content "$stage/blindagem.txt" -Encoding UTF8
          }
          Compress-Archive -Path "$stage/*" -DestinationPath "Wells_Manager_Beta_Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Wells_Manager_Beta_Windows
          path: Wells_Manager_Beta_Windows.zip
          if-no-files-found: error
