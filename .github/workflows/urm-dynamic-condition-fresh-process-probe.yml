name: URM dynamic Choice edited state fresh-process save/load probe

on:
  push:
    branches: [ main ]
    paths:
      - 'URM_REVERSO/tools/fixtures/urm_dynamic_condition_fresh_process_probe.rpy'
      - '.github/workflows/urm-dynamic-condition-fresh-process-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urm-dynamic-condition-fresh-process-probe
  cancel-in-progress: true

jobs:
  dynamic-condition-fresh-process:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxcursor1 libxi6 libxinerama1 libxrandr2 libxss1 libasound2
      - name: Prepare persistent disposable game directory
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/urm-dynamic-condition-fresh-process-probe"
          rm -rf "$probe_root"
          cp -a renpy-7.4.11-sdk/the_question "$probe_root"
          mkdir -p "$probe_root/game/0x52-URM"
          cp -a URM_REVERSO/01_MATERIAL_URM/1_URM_ORIGINAL/. "$probe_root/game/0x52-URM/"
          cp URM_REVERSO/tools/fixtures/urm_dynamic_condition_fresh_process_probe.rpy "$probe_root/game/zz_urm_dynamic_condition_fresh_process_probe.rpy"
          chmod +x renpy-7.4.11-sdk/renpy.sh
          chmod +x renpy-7.4.11-sdk/lib/linux-x86_64/renpy
          test -f "$probe_root/game/0x52-URM/framework/bootstrap.rpy"
          test -f "$probe_root/game/0x52-URM/classes/main.rpy"
          test -f "$probe_root/game/0x52-URM/screens/choices.rpy.x52"
          test -f "$probe_root/game/zz_urm_dynamic_condition_fresh_process_probe.rpy"
      - name: Create save using original URM editor
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START fresh-process state save: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-dynamic-condition-fresh-process-probe" test urm_dynamic_condition_fresh_write
          result=$?
          echo "END fresh-process state save: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
      - name: Load slot in new Ren'Py process
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START fresh-process state load: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-dynamic-condition-fresh-process-probe" test urm_dynamic_condition_fresh_load
          result=$?
          echo "END fresh-process state load: $(date -u +%FT%TZ), exit=$result"
          exit "$result"