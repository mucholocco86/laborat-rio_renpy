name: URM Choice runtime probe

on:
  push:
    branches: [ main ]
    paths:
      - 'URM_REVERSO/tools/fixtures/urm_choice_runtime_probe.rpy'
      - '.github/workflows/urm-choice-runtime-probe.yml'
      - 'renpy-7.4.11-sdk/renpy/**'
      - 'renpy-7.4.11-sdk/the_question/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urm-choice-runtime-probe
  cancel-in-progress: true

jobs:
  choice-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxcursor1 libxi6 libxinerama1 libxrandr2 libxss1 libasound2

      - name: Prepare disposable game copy
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/urm-choice-runtime-probe"
          rm -rf "$probe_root"
          cp -a renpy-7.4.11-sdk/the_question "$probe_root"
          cp URM_REVERSO/tools/fixtures/urm_choice_runtime_probe.rpy "$probe_root/game/zz_urm_choice_runtime_probe.rpy"

          # Make the copied SDK launcher and engine executable only in this job.
          chmod +x renpy-7.4.11-sdk/renpy.sh
          chmod +x renpy-7.4.11-sdk/lib/linux-x86_64/renpy

          echo "Prepared disposable game: $probe_root"
          test -f "$probe_root/game/zz_urm_choice_runtime_probe.rpy"
          test -x renpy-7.4.11-sdk/lib/linux-x86_64/renpy

      - name: Run native visible-choice baseline
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START native baseline: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_native_visible_route
          result=$?
          echo "END native baseline: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run forced false-condition choice probe
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START forced false-condition probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_force_condition_false
          result=$?
          echo "END forced false-condition probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run manual variable edit rollback probe
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START manual edit rollback probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_manual_edit_rollback
          result=$?
          echo "END manual edit rollback probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run ordinary rollback after two interactions
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START ordinary multi-interaction rollback probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_edit_ordinary_rollback
          result=$?
          echo "END ordinary multi-interaction rollback probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run native rollback key input probe
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START native rollback key probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_edit_native_key_rollback
          result=$?
          echo "END native rollback key probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run URM-style container mutation rollback
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START container mutation rollback probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_edit_container_rollback
          result=$?
          echo "END container mutation rollback probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"

      - name: Run native save/load after manual edit
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START native save/load probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-choice-runtime-probe" test urm_edit_save_load_roundtrip
          result=$?
          echo "END native save/load probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
