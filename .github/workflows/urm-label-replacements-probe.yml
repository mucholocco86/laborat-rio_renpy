name: URM labels and replacements .urm runtime probe

on:
  push:
    branches: [ main ]
    paths:
      - 'URM_REVERSO/tools/fixtures/urm_label_replacements_probe.rpy'
      - '.github/workflows/urm-label-replacements-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urm-label-replacements-probe
  cancel-in-progress: true

jobs:
  labels-replacements:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxcursor1 libxi6 libxinerama1 libxrandr2 libxss1 libasound2
      - name: Prepare disposable game
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/urm-label-replacements-probe"
          rm -rf "$probe_root"
          cp -a renpy-7.4.11-sdk/the_question "$probe_root"
          mkdir -p "$probe_root/game/0x52-URM"
          cp -a URM_REVERSO/01_MATERIAL_URM/1_URM_ORIGINAL/. "$probe_root/game/0x52-URM/"
          cp URM_REVERSO/tools/fixtures/urm_label_replacements_probe.rpy "$probe_root/game/zz_urm_label_replacements_probe.rpy"
          chmod +x renpy-7.4.11-sdk/renpy.sh
          chmod +x renpy-7.4.11-sdk/lib/linux-x86_64/renpy
          test -f "$probe_root/game/0x52-URM/framework/bootstrap.rpy"
      - name: Save label and replacement stores through original URM classes
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START labels and replacements write: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-label-replacements-probe" test urm_label_replacements_write
          result=$?
          echo "END labels and replacements write: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
      - name: Inspect JSON stores
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/urm-label-replacements-probe/game/urm-label-replacements-probe.urm" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              payload = {name: json.loads(zf.read(name)) for name in zf.namelist()}
          assert payload["labels"]["urm_store_probe_label"]["name"] == "Persisted label title", payload
          rule = payload["replacements"]["WellsProbeChoice"]
          assert rule["replacement"] == "URMLoadedChoice", rule
          print("URM_LABEL_REPLACEMENT_JSON", json.dumps({k: payload[k] for k in ("labels", "replacements")}, sort_keys=True))
          PY
      - name: Load and exercise replacement filter in a fresh Ren'Py process
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START labels and replacements load: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-label-replacements-probe" test urm_label_replacements_load
          result=$?
          echo "END labels and replacements load: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
