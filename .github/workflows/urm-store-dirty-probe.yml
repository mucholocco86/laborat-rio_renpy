name: URM variable-store dirty flag probe

on:
  push:
    branches: [ main ]
    paths:
      - 'URM_REVERSO/tools/fixtures/urm_store_dirty_probe.rpy'
      - '.github/workflows/urm-store-dirty-probe.yml'
      - 'renpy-7.4.11-sdk/renpy/**'
      - 'renpy-7.4.11-sdk/the_question/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urm-store-dirty-probe
  cancel-in-progress: true

jobs:
  dirty-flag:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxcursor1 libxi6 libxinerama1 libxrandr2 libxss1 libasound2

      - name: Prepare disposable game copy
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/urm-store-dirty-probe"
          rm -rf "$probe_root"
          cp -a renpy-7.4.11-sdk/the_question "$probe_root"
          cp URM_REVERSO/tools/fixtures/urm_store_dirty_probe.rpy "$probe_root/game/zz_urm_store_dirty_probe.rpy"
          chmod +x renpy-7.4.11-sdk/renpy.sh
          chmod +x renpy-7.4.11-sdk/lib/linux-x86_64/renpy
          test -f "$probe_root/game/zz_urm_store_dirty_probe.rpy"
          test -x renpy-7.4.11-sdk/lib/linux-x86_64/renpy

      - name: Run isolated nested dirty-flag probe
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START nested dirty-flag probe: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-store-dirty-probe" test urm_dirty_tracking_nested_metadata
          result=$?
          echo "END nested dirty-flag probe: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
