name: URM .urm runtime persistence probe

on:
  push:
    branches: [ main ]
    paths:
      - 'URM_REVERSO/tools/fixtures/urm_file_persistence_probe.rpy'
      - '.github/workflows/urm-file-persistence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urm-file-persistence-probe
  cancel-in-progress: true

jobs:
  urm-file-persistence:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libglu1-mesa libx11-6 libxext6 libxrender1 libxcursor1 libxi6 libxinerama1 libxrandr2 libxss1 libasound2
      - name: Prepare disposable game
        shell: bash
        run: |
          set -euo pipefail
          probe_root="${RUNNER_TEMP}/urm-file-persistence-probe"
          rm -rf "$probe_root"
          cp -a renpy-7.4.11-sdk/the_question "$probe_root"
          mkdir -p "$probe_root/game/0x52-URM"
          cp -a URM_REVERSO/01_MATERIAL_URM/1_URM_ORIGINAL/. "$probe_root/game/0x52-URM/"
          cp URM_REVERSO/tools/fixtures/urm_file_persistence_probe.rpy "$probe_root/game/zz_urm_file_persistence_probe.rpy"
          chmod +x renpy-7.4.11-sdk/renpy.sh
          chmod +x renpy-7.4.11-sdk/lib/linux-x86_64/renpy
          test -f "$probe_root/game/0x52-URM/framework/bootstrap.rpy"
      - name: Save .urm through original URM classes
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START URM file write: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-file-persistence-probe" test urm_file_probe_write
          result=$?
          echo "END URM file write: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
      - name: Inspect ZIP and JSON stores
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/urm-file-persistence-probe/game/urm-runtime-persistence-probe.urm" <<'PY'
          import json, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
              print("URM_ZIP_ENTRIES", names)
              payload = {name: json.loads(zf.read(name)) for name in names}
          assert "properties" in payload, payload
          assert "vars" in payload, payload
          assert "watched" in payload, payload
          assert payload["vars"]["urm_file_probe_value"]["name"] == "Runtime probe value", payload["vars"]
          assert payload["vars"]["urm_file_probe_value"]["frozen"] is True, payload["vars"]
          assert payload["vars"]["urm_file_probe_value"]["monitor"] is True, payload["vars"]
          assert payload["watched"]["urm_file_probe_value"]["name"] == "Runtime probe watch", payload["watched"]
          assert all(value != 7 for store in payload.values() for value in store.values()), payload
          print("URM_JSON_STORES", json.dumps(payload, sort_keys=True))
          PY
      - name: Load .urm in a fresh Ren'Py process
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -u
          echo "START URM file load: $(date -u +%FT%TZ)"
          set +e
          timeout --signal=TERM --kill-after=10s 120s xvfb-run -a sh renpy-7.4.11-sdk/renpy.sh "${RUNNER_TEMP}/urm-file-persistence-probe" test urm_file_probe_load
          result=$?
          echo "END URM file load: $(date -u +%FT%TZ), exit=$result"
          exit "$result"
